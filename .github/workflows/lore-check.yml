name: lore check

# QCLI-301 (routed from OPAG-146). The shared operating block makes a green
# `lore check` the definition of done for any docs-touching change, and until
# this file existed nothing in this repository's CI ran it: the gate was
# whoever remembered to run it by hand before opening a PR. Measured by
# opum-agent on 2026-09-15 across the fleet, eight of ten repos had the gap.
#
# WHY THIS JOB DOES NOT INSTALL @opum-ai/quest, UNLIKE THE FLEET REFERENCE JOB.
# lore's quest adapter shells out to the `quest` binary on PATH -- a subprocess
# contract, not a file read. It probes `quest --version` first and throws
# validation ("did not report a supported Quest version") when that fails, so a
# missing or broken quest is a hard red, never a degraded read. opum-agent and
# opum-doc satisfy that by installing a published quest next to lore. That is
# right there and wrong here for the same two reasons tracker-integrity.yml
# already gives: this repository AUTHORS quest, so a published pin cannot see a
# regression the pull request itself introduces, and it goes red on every
# version-bump PR because the version the PR declares is not published yet.
# So the `quest` lore runs is a shim that execs `bun run src/cli/main.ts` from
# this same checkout, and a step asserts that is what PATH resolved to and that
# it reports package.json's version -- the two facts that distinguish "the
# checkout's quest" from "some quest".
#
# lore itself IS pinned. It is deliberately not derived from package.json: on
# the PR that bumps this package to the next version the paired lore is not
# published yet, and a derived pin would red exactly the PR that cuts a release.
#
# THE PIN NO LONGER TRACKS "the lore release paired with this package", because
# that phrase stopped naming one number (QCLI-356). CHANGELOG declares the
# quest/lore lockstep deliberately broken -- when this was written quest had
# published 0.9.0 and lore 0.8.0 -- so "the paired release" has no unambiguous
# answer and an instruction to hand-bump to it cannot be followed. The pin names
# the NEWEST PUBLISHED lore whose `lore check` this repository has actually been
# measured against, and the number below is that measurement, not a pairing.
# (lore 0.9.0 now shares quest's number and still claims no pairing with it;
# equal numbers are a coincidence here, not a reinstated lockstep. QCLI-361.)
#
# THE INVARIANT: the number here never moves without the committed schemas being
# regenerated by that same lore. A pin-only change reds this gate whenever the new
# lore changes schema generation, which reads as a broken pin rather than a
# pending regeneration.
#   - Same PR, when the regenerated tree ALSO passes the old pin. QCLI-361 moved
#     0.8.0 -> 0.9.0 this way: `lore schema export` under 0.9.0 added a
#     profileDigest stamp to all seven schemas and a new arc.schema.json, and
#     that tree measured exit 0 under 0.9.0 AND under 0.8.0, 2026-09-22.
#     QCLI-422 moved 0.11.0 -> 0.12.0 the same way on 2026-09-30: the export
#     under 0.12.0 was a no-op, all ten schemas byte-identical, so the pin move
#     is the whole change and the tree measured exit 0 under 0.12.0 AND 0.11.0.
#     0.12.0 also added a quest-pair version requirement -- lore 0.12.0 exits 6
#     against quest 0.11.0 -- satisfied here only because the shimmed checkout
#     reports package.json's 0.12.0; a pin whose lore number leads package.json
#     will red for that reason, not for schema drift.
#   - Two steps when the regenerated tree passes the old pin but the new pin
#     reds the old tree: land the regeneration alone first, then move the
#     number (QCLI-356, 0.7.0 -> 0.8.0). Measure the old pin before choosing.
#   - Same PR, when the regenerated tree FAILS the old pin. No order of two
#     landings is green then, so the change must be atomic. QCLI-394 moved
#     0.9.2 -> 0.11.0 this way: the export restamped all eight profileDigests
#     and added constitution and constants, and 0.9.2 exits 7 on that tree
#     (schema-unattributable on the two new files), 2026-09-27.
#     (Corrected by QCLI-394: this list used to say "two steps otherwise",
#     which read as covering this case. Both precedents it was written from
#     had a regenerated tree that passed the old pin, so the third case was
#     never measured when the rule was worded.)
#
# DEC-169 (opum-doc, 2026-10-07, opum-ai/opum-doc#809) applied a temporary
# fallback here for the paired 0.13.0 release: install the npm pin, and when npm
# did not yet carry it, build lore from a pinned lore-cli git commit -- the
# mirror of lore-cli's own QUEST_SOURCE_REF. With 0.13.0 published the npm pin is
# again the only path (QCLI-433 step 5); the DEC-169 precedent is on QCLI-433 and
# is the shape to reach for if a future pair must go green before one side
# publishes.
# Run the new lore with `npx --yes @opum-ai/lore@<version>` rather than upgrading
# the shared global binary. A `lore check` exit 7 (indeterminate: a schema it
# cannot attribute) means stop and report -- never delete or re-export past it.
#
# THIS GATE CANNOT DETECT ITS OWN STALENESS, which is why the number going out
# of date is tracked as its own task rather than assumed to be noticed.
# `lore check` runs AT the pinned version and compares the committed schemas
# against what THAT version generates, so it is self-consistent by construction
# and stays green as the pin falls behind -- the same shape lore-cli recorded
# as LCLI-504/508. A real detector has to compare this number against something
# outside the run, and must NOT do it with a network read inside this job: a
# flaky required check is worse than a stale one, because it teaches people to
# re-run until green (opum-agent ruling, 2026-09-19). That detector now exists
# OUTSIDE this job: lore-pin-staleness.yml, a weekly, non-required workflow
# that keeps one `lore-pin-stale` issue in step with the pin (QCLI-358).
#
# DETERMINISM, AND ITS ONE LOAD-BEARING CAVEAT. `lore check` writes nothing, has
# no LLM dependency, and reads the evaluation date from HEAD's committer date
# rather than the clock, so a clean run locally is a clean run here for the same
# tree AND THE SAME LORE VERSION. The version is part of the precondition, not
# background: this paragraph used to end at "the same tree", and it was false --
# measured 2026-09-19 on one commit, lore 0.7.0 exited 0 with zero errors while
# lore 0.8.0 exited 6 with seven schema-drift errors, because 0.7.0 has no
# schema-drift detection at all. Holding the tree constant while letting the
# tool vary is exactly how a required context goes green on something it cannot
# see. If a local run disagrees with this job, compare `lore --version` BEFORE
# suspecting the tree. As with
# tracker-integrity.yml, setup reaches the network (setup-bun, the frozen
# lockfile install, and `npm install -g` of lore) while the assertions read
# only the commit -- so a red in setup with a green `lore check` locally points
# at the registry or the runner, not at the docs.
#
# Runs on push as well as pull_request deliberately, for the reason
# tracker-integrity.yml and promotion-guardrails.yml record: a context that
# only ever reports on pull_request never appears on dev's tip commit, and
# GitHub gates a direct push by that commit's own prior check history, so
# making a PR-only context required would make `git push origin origin/dev:main`
# permanently unpushable. Enrolled in main's required-checks ruleset
# (require-ci-on-main) on 2026-09-15 by the repository owner, after this
# context had reported green on main's tip 9258018 through the push trigger
# (run 34990613983) -- the sequencing that keeps the promotion push pushable.
# Renaming this job now needs the ruleset edit in the same change.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: lore-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lore:
    name: lore check
    runs-on: ubuntu-24.04
    env:
      # DEC-169 (opum-doc, 2026-10-07, opum-ai/opum-doc#809): for the paired
      # 0.14.1 release this job installs the pinned lore from npm as always, and
      # FALLS BACK to building it from a lore-cli git commit when npm does not yet
      # have it -- the mirror of lore-cli's own setup-quest action (lore-cli
      # DEC-55). It exists because the pair rule refuses a 0.12.0 lore against
      # this 0.14.1 tree (exit 6), while lore cannot publish 0.14.1 until
      # quest-cli's `main` reads it (scripts/version-parity.mjs reads the peer's
      # main, not the registry). The source fallback lets this job go green before
      # either side publishes; both mains then carry 0.14.1 and both publishes
      # follow. The pair moved here from 0.14.0, which was tagged on both sides
      # and never published (DEC-204 (2)). TEMPORARY: once 0.14.1 is on npm a
      # follow-up PR drops this variable and the npm install is again the only
      # path. The value is a lore-cli commit carrying this checkout's version; the
      # assertion step below fails loudly if it does not.
      LORE_SOURCE_REF: bbe15535d850d8830ced18f1fb14b1b47fe19df3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --linker=isolated

      - name: Put the quest built from this checkout on PATH
        run: |
          set -euo pipefail
          # Bake the ABSOLUTE bun path set up above. A later step installs the bun
          # pin the lore-cli source build needs, and that must not change which
          # runtime runs THIS repository's own quest.
          quest_bun="$(command -v bun)"
          shim_dir="$RUNNER_TEMP/quest-shim"
          mkdir -p "$shim_dir"
          printf '#!/bin/sh\nexec "%s" run "%s/src/cli/main.ts" "$@"\n' "$quest_bun" "$GITHUB_WORKSPACE" > "$shim_dir/quest"
          chmod +x "$shim_dir/quest"
          echo "$shim_dir" >> "$GITHUB_PATH"

      - name: lore will run this checkout's quest, not a published one
        run: |
          set -euo pipefail
          resolved="$(command -v quest || true)"
          expected="$RUNNER_TEMP/quest-shim/quest"
          if [ "$resolved" != "$expected" ]; then
            echo "::error::PATH resolves quest to '${resolved:-nothing}', not the checkout shim at '$expected'. lore would run against a quest this pull request did not build."
            exit 1
          fi
          reported="$(quest --version)"
          packaged="$(node -p "require('./package.json').version")"
          if [ "$reported" != "$packaged" ]; then
            echo "::error::The quest on PATH reports $reported but this checkout's package.json is $packaged, so it is not the quest this pull request built."
            exit 1
          fi
          echo "quest on PATH: $resolved (reports $reported, package.json $packaged)"

      # DEC-169: install the pinned lore from npm, or -- when it is not yet on
      # npm -- build it from a lore-cli git commit (LORE_SOURCE_REF). The npm
      # attempt comes FIRST and the literal pin stays a single line, so
      # scripts/lore-pin-staleness.mjs still reads it (QCLI-358). This is the
      # exact mirror of lore-cli's setup-quest action (DEC-55). The fallback takes
      # ANY npm failure, not only "no matching version": an unreachable registry
      # is indistinguishable from an absent version at the exit code, and the
      # assertion below refuses a build that does not carry the right version.
      - name: Install the pinned lore release, or build it from source if npm lacks it
        id: lore
        run: |
          set -euo pipefail
          if npm install -g @opum-ai/lore@0.14.1; then
            echo "method=npm" >> "$GITHUB_OUTPUT"
            echo "::notice::lore 0.14.1 installed from npm, exactly as before DEC-169"
          else
            echo "method=source" >> "$GITHUB_OUTPUT"
            echo "::notice::lore 0.14.1 is not on npm; building opum-ai/lore-cli at $LORE_SOURCE_REF"
          fi

      - if: steps.lore.outputs.method == 'source'
        name: Clone lore-cli at the pinned source ref and read its bun pin
        id: loresrc
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/lore-cli"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/opum-ai/lore-cli.git "$dest"
          git -C "$dest" cat-file -e "$LORE_SOURCE_REF^{commit}" 2>/dev/null || {
            echo "::error::the pinned lore-cli ref $LORE_SOURCE_REF is not a commit in the cloned repository. Verify it against the remote rather than assuming the clone is broken: a 40-character value that resolves nowhere is usually a composed or mistyped id, and a string that denotes no object answers identically from every query."
            exit 1
          }
          git -C "$dest" checkout --quiet "$LORE_SOURCE_REF"
          echo "bun-version=$(cat "$dest/.bun-version")" >> "$GITHUB_OUTPUT"

      # lore-cli's lockfile was written by its OWN pinned runtime; a different
      # bun compares against another runtime's lock and fails for a reason that
      # has nothing to do with the docs under test (the reason setup-quest
      # records in lore-cli).
      - if: steps.lore.outputs.method == 'source'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.loresrc.outputs.bun-version }}

      - if: steps.lore.outputs.method == 'source'
        name: Build lore from the pinned ref and put it on PATH
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/lore-cli"
          (cd "$dest" && bun install --frozen-lockfile --linker=isolated)
          lore_bun="$(command -v bun)"
          bin="$RUNNER_TEMP/lore-bin"
          mkdir -p "$bin"
          printf '#!/usr/bin/env bash\nexec "%s" run "%s/src/cli.ts" "$@"\n' "$lore_bun" "$dest" > "$bin/lore"
          chmod +x "$bin/lore"
          echo "$bin" >> "$GITHUB_PATH"

      - name: lore on PATH reports this checkout's pair version
        run: |
          set -euo pipefail
          declared="$(node -p "require('./package.json').version")"
          reported="$(lore --version)"
          if [ "$reported" != "$declared" ]; then
            echo "::error::the lore on PATH reports $reported but this checkout's package.json is $declared. The pair rule requires them equal; a mismatch means the source ref and the declaration have drifted apart, named HERE as a ref problem rather than later as a pair-lock refusal that reads like a lore defect."
            exit 1
          fi
          if [ "${{ steps.lore.outputs.method }}" = "source" ]; then
            resolved="$(command -v lore)"
            expected="$RUNNER_TEMP/lore-bin/lore"
            if [ "$resolved" != "$expected" ]; then
              echo "::error::PATH resolves lore to '${resolved:-nothing}', not the source build at '$expected'. The gate would run against a lore this pull request did not build."
              exit 1
            fi
            echo "lore on PATH: $resolved (reports $reported, package.json $declared, built from source at $LORE_SOURCE_REF)"
          else
            echo "lore on PATH: $(command -v lore) (reports $reported, package.json $declared, installed from npm)"
          fi

      - name: lore check
        run: lore check

      # QCLI-367 (OPAG-378 AC4): the lore:agents block in CLAUDE.md is generated
      # by `lore agents`; this fails (exit 6) when it drifts from what the pinned
      # lore generates, the same way `quest agents --check` gates Quest's block.
      - name: lore agents --check
        run: lore agents --check
